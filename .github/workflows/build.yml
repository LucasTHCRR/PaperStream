name: Build

on:
  push:
    branches: [main, "ver/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Git identity for patching
        run: |
          git config --global user.name "PaperStream CI"
          git config --global user.email "ci@paperstream.dev"
      - name: Apply patches
        run: ./gradlew applyAllPatches --console=plain
      - name: Build server jar
        run: |
          if grep -q '^mcVersion=1\.21' gradle.properties; then
            ./gradlew createMojmapPaperclipJar --console=plain
          else
            ./gradlew createPaperclipJar --console=plain
          fi
      - name: Read Minecraft version
        run: echo "MC_VERSION=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Upload server jar
        uses: actions/upload-artifact@v5
        with:
          name: paperstream-${{ env.MC_VERSION }}
          path: paperstream-server/build/libs/paperstream-paperclip-*.jar
          if-no-files-found: error
