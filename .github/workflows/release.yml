name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag --title "PaperStream ${GITHUB_REF_NAME#v}" --notes "Draft, notes follow."

  build:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        branch: [ver/26.3, main, ver/26.1, ver/1.21.11]
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Git identity for patching
        run: |
          git config --global user.name "PaperStream CI"
          git config --global user.email "ci@paperstream.dev"
      - name: Apply patches
        run: ./gradlew applyAllPatches --console=plain
      - name: Build server jar
        run: |
          if grep -q '^mcVersion=1\.21' gradle.properties; then
            ./gradlew createMojmapPaperclipJar --console=plain
          else
            ./gradlew createPaperclipJar --console=plain
          fi
      - name: Name the jar
        run: |
          mc=$(grep '^mcVersion=' gradle.properties | cut -d= -f2 | sed 's/^26\.1\.2$/26.1/')
          version=${GITHUB_REF_NAME#v}
          mkdir out
          cp paperstream-server/build/libs/paperstream-paperclip-*.jar "out/paperstream-$mc-$version.jar"
          (cd out && sha256sum "paperstream-$mc-$version.jar" > "paperstream-$mc-$version.jar.sha256")
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" out/* --clobber
